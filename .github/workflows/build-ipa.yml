name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned (iOS device)
        run: |
          xcodebuild -scheme SerienStream \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SerienStream.ipa Payload
          ls -la SerienStream.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SerienStream-ipa
          path: SerienStream.ipa

      # ---------- Simulator-Verifikation ----------

      - name: Build for Simulator
        run: |
          xcodebuild -scheme SerienStream \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build-sim \
            build || \
          xcodebuild -scheme SerienStream \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build-sim \
            build

      - name: Boot simulator and install
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[567]" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "Device: $UDID"
          xcrun simctl boot "$UDID" || true
          sleep 5
          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          xcrun simctl install booted "$APP"
          echo "installed"

      - name: Smoke test (logik + scraping)
        run: |
          xcrun simctl launch booted com.serienstream.ios -smokeTest || true
          sleep 30
          CONTAINER=$(xcrun simctl get_app_container booted com.serienstream.ios data 2>/dev/null || echo "")
          echo "container: $CONTAINER"
          mkdir -p ci-out
          if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/debug.log" ]; then
            cp "$CONTAINER/Documents/debug.log" ci-out/debug.log
            cat ci-out/debug.log
          else
            echo "NO DEBUG LOG FOUND"
          fi
          xcrun simctl io booted screenshot ci-out/shot-home.png || true
          xcrun simctl terminate booted com.serienstream.ios || true

      - name: Screenshot detail page
        run: |
          mkdir -p ci-out
          xcrun simctl launch booted com.serienstream.ios -openSeries und-dann-noch-paula || true
          sleep 15
          xcrun simctl io booted screenshot ci-out/shot-detail.png || true
          xcrun simctl terminate booted com.serienstream.ios || true
          CONTAINER=$(xcrun simctl get_app_container booted com.serienstream.ios data 2>/dev/null || echo "")
          if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/debug.log" ]; then
            cp "$CONTAINER/Documents/debug.log" ci-out/debug-detail.log
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ci-verification
          path: ci-out/
